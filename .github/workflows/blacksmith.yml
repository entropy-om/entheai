name: Blacksmith CI — entheai full

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: blacksmith-entheai-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build_and_test:
    name: Rust build + clippy + test (quantum + oracle + fusion)
    # Was ubuntu-2204, which sat queued for hours on 2026-08-12 while every
    # 2404 workflow in this repo ran fine. 2204 is not deprecated (it ran on
    # 08-10) but it is not being served reliably; the rest of the repo is on
    # 2404 already, so this is now the one label instead of the odd one out.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - uses: useblacksmith/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: blacksmith-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: blacksmith-cargo-

      - name: Build
        run: |
          cargo build -p entheai-quantum
          cargo build -p entheai-orchestrator
          cargo build -p entheai

      - name: Clippy (deny warnings)
        run: cargo clippy -p entheai-quantum -p entheai-orchestrator -p entheai --all-targets -- -D warnings

      - name: Test — quantum emulator
        run: cargo test -p entheai-quantum --lib

      - name: Test — oracle (fusion)
        run: cargo test -p entheai-orchestrator --lib oracle

      - name: Test — orchestrator
        run: cargo test -p entheai-orchestrator --lib

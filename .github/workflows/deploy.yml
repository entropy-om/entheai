name: Deploy site
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  # Roadmap 4.2: the automated hourly build cycle — regenerates the site
  # (build-site.mjs stamps fresh llms.txt / llms-full.txt) and redeploys.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

# The runner went offline on 2026-08-11 and the hourly cron kept queueing: by
# the time anyone looked there were 16 identical builds waiting, each ending in
# its own wrangler deploy of the same content. Only the newest deploy is ever
# worth running, so supersede the rest instead of letting an outage turn into a
# backlog.
concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, dev-cx53]
    environment: main
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

# ==============================================================================
# ENTHEAI CONFIGURATION — DEEPSEEK V4 (FLASH | PRO) ALL THE WAY DOWN
# ==============================================================================
# Every key in this file exists in crates/config (entheai-config). The parser
# ignores unknown keys silently, so keep this file honest — see
# docs/configuration.md for the full reference.
#
# Model ids are "<provider>/<model>". Credits today: deepseek (default engine)
# and gemini; openrouter is declared as a key-only third fallback. All three are
# also injected as built-ins by entheai-config; the blocks below make the intent
# explicit.

# Interactive default (`entheai`, `entheai "prompt"`, `--model` unset):
# DeepSeek V4 Flash — fast + cheap, 1M context.
default_model = "deepseek/deepseek-v4-flash"

# ── Inference Providers ────────────────────────────────────────────────────────

# 1. DeepSeek direct API — V4 Flash (fast/cheap) + V4 Pro (strong)
[providers.deepseek]
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"

# 2. Google Gemini — first fallback. kind = "gemini" = adk-rust's native Gemini
#    client (Gemini 3.x tool calls need it; the OpenAI-compatible endpoint drops
#    the thought_signature round-trip and 400s on the second turn).
[providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"   # unused for kind = "gemini"
api_key_env = "GEMINI_API_KEY"
kind = "gemini"

# 3. OpenRouter aggregator — second fallback (deepseek/* + google/* ids)
[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

# ── Inference Parameters (applied to every LLM call) ───────────────────────────
[inference]
temperature = 0.3
max_tokens = 2048

# ── Router / Fan-out Orchestration ────────────────────────────────────────────
[router]
# Plans, decomposes and synthesizes — the strongest model in the swarm.
orchestrator = "deepseek/deepseek-v4-pro"
# Max sub-agents running concurrently during `--fanout`.
max_parallel = 6

[fanout]
# "local": every coder runs in-process on the [agents.*] models below.
# "auto" would dispatch to the federation when [federation] is on and a worker
# answers; "agy" / "copilot" would run coders on those CLIs instead (bypassing
# [agents.coder]) — not what "DeepSeek all the way down" wants.
executor = "local"
# Never trust self-reported success: changed worktrees must pass `verify`
# (auto-detected ./scripts/check.sh when unset) before integration.
verify_required = true
# Per-coder timeout before it is force-aborted.
coder_timeout_secs = 600

# Per-role preference chains: the FIRST entry whose provider is available
# (declared + key in env) wins; a role with no usable entry falls back to the
# orchestrator, and fan-out degrades to the keyless vaked free tier last.
# Light roles ride V4 Flash, code-writing/judging roles ride V4 Pro.

[agents.explore]
model = [
  "deepseek/deepseek-v4-flash",
  "gemini/gemini-3.6-flash",
  "openrouter/deepseek/deepseek-v4-flash",
]

[agents.coder]
model = [
  "deepseek/deepseek-v4-pro",
  "gemini/gemini-3.1-pro-preview",
  "openrouter/deepseek/deepseek-v4-pro",
]

[agents.reviewer]
model = [
  "deepseek/deepseek-v4-pro",
  "gemini/gemini-3.1-pro-preview",
  "openrouter/deepseek/deepseek-v4-pro",
]

[agents.test]
model = [
  "deepseek/deepseek-v4-flash",
  "gemini/gemini-3.6-flash",
  "openrouter/deepseek/deepseek-v4-flash",
]

[agents.docs]
model = [
  "deepseek/deepseek-v4-flash",
  "gemini/gemini-3.6-flash",
  "openrouter/deepseek/deepseek-v4-flash",
]

# ── The Oracle (Adjudication Seam) ────────────────────────────────────────────
[oracle]
enabled = true
coders = "local"
gate = "advisory"
block_confidence = 0.8
model = "deepseek/deepseek-v4-pro"

# ── Memory (5-namespace SQLite + vector store) ────────────────────────────────
# Defaults: path = ~/.cache/entheai/memory.db, embed_model = nomic-embed-text.
[memory]
enabled = true

# ── Model Context Protocol (MCP) Servers ──────────────────────────────────────

# Smart Tree: AST context compression, symbol extraction (8b-is/smart-tree)
[mcp.smart-tree]
command = "st"
args = ["--mcp"]

# DeepSeek Harness (dsh): plugin-first agent runtime (deepseek-ai/deepseek-harness)
[mcp.deepseek-harness]
command = "npx"
args = ["-y", "@deepseek-ai/dsh", "mcp"]

# ── Companion Floating Session Beacon ──────────────────────────────────────────
[companion]
enabled = true
always_on_top = true

# ── NATS Federation & Distributed Fleet Swarm ─────────────────────────────────
# The NATS URL/token come from the environment (NATS_URL / NATS_TOKEN), never
# from this file. [nats] drives the fan-out event bus; [federation] still serves
# the read-only `/fleet` roster, the MCP `entheai_dispatch` tool and
# entheai-worker — but with [fanout].executor = "local" above, `--fanout`
# coders always run in-process.
[nats]
enabled = true
url_env = "NATS_URL"
token_env = "NATS_TOKEN"

[federation]
enabled = true
deadline_secs = 600
sandbox = "permissive"
max_concurrent_coders = 4

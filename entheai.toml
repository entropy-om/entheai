default_model = "openai/gpt-4o-mini"

# ── Inference Providers ────────────────────────────────────────────────────────

# DeepSeek direct API
[providers.deepseek]
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"

# OpenRouter aggregator
[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

# OpenAI direct API
[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

# Anthropic direct API (via OpenAI-compatible gateway / OpenRouter)
[providers.anthropic]
base_url = "https://api.anthropic.com/v1"
api_key_env = "ANTHROPIC_API_KEY"

# Hugging Face Inference router
[providers.hf]
base_url = "https://router.huggingface.co/v1"
api_key_env = "HUGGINGFACE_API_KEY"

# OpenCode Zen (DeepSeek V4 Pro, Flash, Qwen)
[providers.zen]
base_url = "https://opencode.ai/zen/v1"
api_key_env = "OPENCODE_API_KEY"

# Vaked Sovereign Community Node (nixai-base tailnet)
[providers.vaked]
base_url = "https://nixai-base.tail2870dc.ts.net/v1"
api_key_env = "VAKED_API_KEY"

# Ocean High-Compute Cluster
[providers.ocean]
base_url = "https://ocean.vaked.dev/v1"
api_key_env = "OCEAN_API_KEY"

# Local private inference via Osaurus (Apple Silicon MLX)
[providers.osaurus]
base_url = "http://127.0.0.1:1337/v1"

# Native Ternary (BitNet b1.58) offline inference engine
[providers.quantal]
base_url = ""
model_dir = "/Users/lodripeter/workspace/peterlodri-sec/pocoo.vaked.dev/demos/quantal"
kind = "ternary"

# OpenClaw Droplet Gateway (DigitalOcean)
[providers.openclaw]
base_url = "https://do-openclaw.tail2870dc.ts.net/v1"
api_key_env = "OPENCLAW_GATEWAY_TOKEN"

# Coder Vaked Tiers
[providers.coder]
base_url = "https://nixai-base.tail2870dc.ts.net/v1"
api_key_env = "CODER_VAKED_PETER_KEY"

[providers.coder-premium]
base_url = "https://nixai-base.tail2870dc.ts.net/v1"
api_key_env = "CODER_VAKED_PETER_KEY"

# ── Multi-Agent Fan-Out Orchestration ──────────────────────────────────────────

[fanout]
enabled = true
max_parallel_coders = 6
worktree_isolation = true
depth_guard = 3
executor = "agy" # Antigravity CLI integration for recursive development

[agents.explore]
model = ["openai/gpt-4o-mini", "zen/deepseek-v4-flash"]

[agents.coder]
model = ["openai/gpt-4o-mini", "zen/deepseek-v4-pro", "vaked/coder"]

[agents.reviewer]
model = ["openai/gpt-4o", "zen/deepseek-v4-pro"]

[agents.test]
model = ["openai/gpt-4o-mini", "osaurus/qwen3-coder"]

[agents.docs]
model = ["openai/gpt-4o-mini"]

# ── Cognitive Vector Memory (MEM|8 Holographic Resonance) ─────────────────────

[memory]
enabled = true
database_path = "~/.entheai/memory.db"
vector_dim = 1536
resonance_bands = ["gamma_8hz", "beta_4hz", "alpha_2hz", "theta_1hz"]
max_context_recall = 8

[memory.namespaces]
codebase = true
learnings = true
trajectories = true
tool_results = true
scratch = true

[memory.judge]
enabled = true
model = "openai/gpt-4o-mini"
confidence_threshold = 0.82

# ── Model Context Protocol (MCP) Servers ──────────────────────────────────────

# Smart Tree: AST Context Compression & Symbol Extraction (8b-is/smart-tree)
[mcp.smart-tree]
command = "st"
args = ["--mcp"]

# MagiSCanner: Cryptographic Hash Memory & Security Sentinel (8bit-wraith/magiscanner)
[mcp.magiscanner]
command = "magiscanner"
args = ["--mcp"]

# Codebase Memory Knowledge Graph
[mcp.codebase]
command = "codebase-memory-mcp"
args = ["--root", "."]

# ── Companion Floating Session Beacon ──────────────────────────────────────────

[companion]
enabled = true
always_on_top = true
window_size = [180, 180]
tailnet_qr = true

# ── Procedural Radio & Audio Synthesis ────────────────────────────────────────

[radio]
enabled = true
stream_url = "https://music.vaked.dev/feed.xml"
tuning_hz = 432.0
volume = 0.65

# ── NATS Federation & Distributed Swarm ───────────────────────────────────────

[nats]
enabled = true
url = "nats://dev-cx53.tail2870dc.ts.net:4222"
cluster_nodes = [
  "dev-cx53.tail2870dc.ts.net",
  "hetzner-cax31.tail2870dc.ts.net"
]

[federation]
enabled = true
role = "auto"
deadline_secs = 600
sandbox = "permissive"
max_concurrent_coders = 4

# ── The Oracle (Adjudication Seam) ────────────────────────────────────────────

[oracle]
enabled = true
coders = "local"
gate = "advisory"
block_confidence = 0.8
model = "openai/gpt-4o-mini"
openclaw_url = "https://do-openclaw.tail2870dc.ts.net"

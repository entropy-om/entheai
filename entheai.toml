# ==============================================================================
# ENTHEAI CONFIGURATION — 8B.IS / VAKED SOVEREIGN FLEET (DEEPSEEK + GOOGLE ULTRA)
# ==============================================================================

# DeepSeek is the primary default provider
default_model = "deepseek/deepseek-chat"

# ── Inference Providers ────────────────────────────────────────────────────────

# 1. DeepSeek direct API (Main Engine: V3 chat & R1 reasoning)
[providers.deepseek]
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"

# 2. Google Gemini (Google Ultra setup: Gemini 2.5 Pro / Flash via OpenAI-compatible endpoint)
[providers.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key_env = "GEMINI_API_KEY"

# 3. Fleet Ollama (Tailnet distributed worker inference on Apple Silicon / Hetzner)
[providers.fleet-ollama]
base_url = "http://lodris-macbook-pro.tail2870dc.ts.net:11434/v1"

# 4. Local Ollama (Local macOS loopback inference)
[providers.local-ollama]
base_url = "http://127.0.0.1:11434/v1"

# 5. coder.vaked.dev — Free Community Lane (nixai-base Tailnet)
[providers.coder]
base_url = "https://nixai-base.tail2870dc.ts.net/v1"
api_key_env = "CODER_VAKED_FREE_KEY"

# 6. coder.vaked.dev — Premium Dedicated Lane (Peter's Sovereign High-Priority Key)
[providers.coder-premium]
base_url = "https://nixai-base.tail2870dc.ts.net/v1"
api_key_env = "CODER_VAKED_PETER_KEY"

# 7. OpenCode Zen Gateway
[providers.zen]
base_url = "https://opencode.ai/zen/v1"
api_key_env = "OPENCODE_API_KEY"

# 8. OpenRouter Aggregator
[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

# 9. OpenAI Direct API
[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

# 10. Native 1.58-Bit Ternary Engine (BitNet offline)
[providers.quantal]
base_url = ""
model_dir = "/Users/lodripeter/workspace/peterlodri-sec/pocoo.vaked.dev/demos/quantal"
kind = "ternary"

# ── Multi-Agent Fan-Out Orchestration ──────────────────────────────────────────
# Fleet Ollama + DeepSeek + Google Ultra + Coder Premium for parallel sub-agents

[fanout]
enabled = true
max_parallel_coders = 6
worktree_isolation = true
depth_guard = 3
executor = "agy" # Google Ultra Antigravity CLI integration for recursive coding

# Exploration: DeepSeek V3 + Gemini Flash + Fleet Ollama
[agents.explore]
model = [
  "deepseek/deepseek-chat",
  "gemini/gemini-2.5-flash",
  "fleet-ollama/qwen2.5-coder:7b"
]

# Coders: DeepSeek V3 + Coder Premium (DeepSeek-V4-Pro) + Gemini Pro + Fleet Ollama
[agents.coder]
model = [
  "deepseek/deepseek-chat",
  "coder-premium/deepseek-v4-pro",
  "gemini/gemini-2.5-pro",
  "fleet-ollama/qwen2.5-coder:14b",
  "coder/qwen3-coder"
]

# Reviewers: DeepSeek R1 (reasoner) + Gemini 2.5 Pro + DeepSeek V3
[agents.reviewer]
model = [
  "deepseek/deepseek-reasoner",
  "gemini/gemini-2.5-pro",
  "deepseek/deepseek-chat"
]

# Test Generators & Runners: Fleet Ollama + Local Ollama + DeepSeek V3
[agents.test]
model = [
  "fleet-ollama/qwen2.5-coder:7b",
  "local-ollama/qwen2.5-coder",
  "deepseek/deepseek-chat"
]

# Documentation: Gemini Flash + DeepSeek V3
[agents.docs]
model = [
  "gemini/gemini-2.5-flash",
  "deepseek/deepseek-chat"
]

# ── Cognitive Vector Memory (MEM|8 Resonance) ─────────────────────────────────

[memory]
enabled = true
database_path = "~/.entheai/memory.db"
vector_dim = 1536
resonance_bands = ["gamma_8hz", "beta_4hz", "alpha_2hz", "theta_1hz"]
max_context_recall = 8

[memory.namespaces]
codebase = true
learnings = true
trajectories = true
tool_results = true
scratch = true

[memory.judge]
enabled = true
model = "deepseek/deepseek-chat"
confidence_threshold = 0.82

# ── Model Context Protocol (MCP) Servers ──────────────────────────────────────

# Smart Tree: AST Context Compression & Symbol Extraction (8b-is/smart-tree)
[mcp.smart-tree]
command = "st"
args = ["--mcp"]

# MagiSCanner: Cryptographic Hash Memory & Security Sentinel (8bit-wraith/magiscanner)
[mcp.magiscanner]
command = "magiscanner"
args = ["--mcp"]

# DeepSeek Harness (dsh): Plugin-First Agent Runtime & Trajectory Engine (deepseek-ai/deepseek-harness)
[mcp.deepseek-harness]
command = "npx"
args = ["-y", "@deepseek-ai/dsh", "mcp"]

# Codebase Memory Knowledge Graph
[mcp.codebase]
command = "codebase-memory-mcp"
args = ["--root", "."]

# ── Companion Floating Session Beacon ──────────────────────────────────────────

[companion]
enabled = true
always_on_top = true
window_size = [180, 180]
tailnet_qr = true

# ── Procedural Radio & Audio Synthesis ────────────────────────────────────────

[radio]
enabled = true
stream_url = "https://music.vaked.dev/feed.xml"
tuning_hz = 432.0
volume = 0.65

# ── NATS Federation & Distributed Fleet Swarm ─────────────────────────────────

[nats]
enabled = true
url = "nats://dev-cx53.tail2870dc.ts.net:4222"
cluster_nodes = [
  "dev-cx53.tail2870dc.ts.net",
  "hetzner-cax31.tail2870dc.ts.net"
]

[federation]
enabled = true
role = "auto"
deadline_secs = 600
sandbox = "permissive"
max_concurrent_coders = 4

# ── The Oracle (Adjudication Seam) ────────────────────────────────────────────

[oracle]
enabled = true
coders = "local"
gate = "advisory"
block_confidence = 0.8
model = "deepseek/deepseek-reasoner"
openclaw_url = "https://do-openclaw.tail2870dc.ts.net"
